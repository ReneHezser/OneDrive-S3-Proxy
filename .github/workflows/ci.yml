name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - ".github/**"
  pull_request_target:
    branches: [main]
    types: [closed]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.sha }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_target' }}

jobs:
  test:
    name: Test
    if: ${{ github.event_name != 'pull_request_target' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore OneDriveS3Proxy.sln

      - name: Test
        run: dotnet test OneDriveS3Proxy.sln --configuration Release --no-restore --logger "trx;LogFileName=tests.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Determine publishing policy
        id: publish-policy
        env:
          SHOULD_PUBLISH: ${{ (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
        run: echo "publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Read image version from changelog
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          versions = re.findall(r"^## \[([^\]]+)\]", changelog, re.MULTILINE)
          version = next((value for value in versions if value != "Unreleased"), None)
          if version is None or re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) is None:
              raise SystemExit("CHANGELOG.md must start its releases with a ## [MAJOR.MINOR.PATCH] heading (optionally after ## [Unreleased]).")

          image = "ghcr.io/" + os.environ["GITHUB_REPOSITORY"].lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nimage={image}\n")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ steps.publish-policy.outputs.publish == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish for a merged PR or manual main run
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: ${{ steps.publish-policy.outputs.publish == 'true' }}
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest
            ${{ steps.metadata.outputs.image }}:sha-${{ env.SOURCE_SHA }}
            ${{ steps.metadata.outputs.image }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Tag platform images without creating extra indexes
        if: ${{ steps.publish-policy.outputs.publish == 'true' }}
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ steps.metadata.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RUN_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          image = os.environ["IMAGE"]
          manifest = json.loads(subprocess.check_output(
              ["docker", "buildx", "imagetools", "inspect", "--raw", f"{image}@{os.environ['IMAGE_DIGEST']}"],
              text=True))
          entries = manifest.get("manifests", [])
          if len(entries) != 2:
              raise SystemExit("Expected exactly two platform manifests without attestations.")

          digests = {}
          for architecture in ("amd64", "arm64"):
              matches = [
                  entry["digest"] for entry in entries
                  if entry.get("platform", {}).get("os") == "linux"
                  and entry.get("platform", {}).get("architecture") == architecture
              ]
              if len(matches) != 1 or not isinstance(matches[0], str) or re.fullmatch(r"sha256:[0-9a-f]{64}", matches[0]) is None:
                  raise SystemExit(f"Expected exactly one valid linux/{architecture} manifest digest.")
              digests[architecture] = matches[0]

          for architecture, digest in digests.items():
              tags = [
                  f"{image}:{os.environ['VERSION']}-{architecture}",
                  f"{image}:sha-{os.environ['SOURCE_SHA']}-{architecture}",
                  f"{image}:{os.environ['RUN_TAG']}-{architecture}",
              ]
              command = ["docker", "buildx", "imagetools", "create", "--prefer-index=false"]
              for tag in tags:
                  command.extend(["--tag", tag])
              subprocess.run(command + [f"{image}@{digest}"], check=True)
          PY
