apiVersion: apps/v1
kind: Deployment
metadata:
  name: onedrive-s3-proxy
  labels:
    app.kubernetes.io/name: onedrive-s3-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: onedrive-s3-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onedrive-s3-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: ghcr.io/your-org/onedrive-s3-proxy:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: onedrive-s3-proxy
            - secretRef:
                name: onedrive-s3-proxy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: onedrive-s3-proxy
spec:
  selector:
    app.kubernetes.io/name: onedrive-s3-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
