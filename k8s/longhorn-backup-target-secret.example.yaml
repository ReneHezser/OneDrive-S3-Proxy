apiVersion: v1
kind: Secret
metadata:
  name: onedrive-s3-backup-target
  namespace: longhorn-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "same-value-as-S3__AccessKey"
  AWS_SECRET_ACCESS_KEY: "same-value-as-S3__SecretKey"
  AWS_ENDPOINTS: "http://onedrive-s3-proxy.default.svc.cluster.local"
  VIRTUAL_HOSTED_STYLE: "false"
